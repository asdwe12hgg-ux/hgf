<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Fire - النظام المركزي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f8fafc;
        }

        .container {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            margin: 20px;
        }

        h1 {
            color: #ef4444;
            text-align: center;
            margin-bottom: 5px;
            font-size: 28px;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #475569;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
        }

        .input-group input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }

        .email-input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid #475569;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.6);
        }

        .email-input-wrapper input {
            border: none;
            background: transparent !important;
            box-shadow: none !important;
        }

        .domain-suffix {
            background-color: #334155;
            padding: 12px;
            color: #cbd5e1;
            font-size: 15px;
            border-right: 1px solid #475569;
            white-space: nowrap;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            margin-top: 10px;
            text-align: center;
        }

        .btn:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
        }

        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .inbox-header h2 {
            font-size: 20px;
            color: #38bdf8;
        }

        .email-badge {
            background: #1e293b;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #94a3b8;
            border: 1px solid #475569;
        }

        .message-list {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .message-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .message-card h4 {
            color: #f8fafc;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .message-card p {
            color: #94a3b8;
            font-size: 13px;
        }

        .no-messages {
            text-align: center;
            color: #64748b;
            padding: 30px;
            font-size: 14px;
        }

        .hidden {
            display: none !important;
        }

        .logout-btn {
            background: #475569;
            font-size: 14px;
            margin-top: 5px;
            border: none;
            display: block;
            width: 100%;
        }
        .logout-btn:hover {
            background: #334155;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- قسم إنشاء الحساب -->
        <div id="signupSection">
            <h1>Iron Fire</h1>
            <p class="subtitle">أنشئ حسابك لربط البريد الإلكتروني باللعبة</p>

            <form id="signupForm" onsubmit="registerUser(event)">
                <div class="input-group">
                    <input type="text" id="fullName" placeholder="الاسم الكامل" required>
                </div>
                <div class="input-group">
                    <div class="email-input-wrapper">
                        <input type="text" id="username" placeholder="اسم المستخدم (مثال: yacine)" required style="text-align: left;" dir="ltr">
                        <span class="domain-suffix" dir="ltr">@ured.com</span>
                    </div>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="كلمة المرور" required>
                </div>
                <button type="submit" class="btn" id="submitBtn">إنشاء الحساب ودخول البريد</button>
            </form>
        </div>

        <!-- قسم البريد الوارد (Inbox) -->
        <div id="inboxSection" class="hidden">
            <div class="inbox-header">
                <h2>البريد الوارد 📥</h2>
                <span class="email-badge" id="currentEmailBadge">user@ured.com</span>
            </div>

            <div class="message-list" id="messageList">
                <div class="no-messages">جاري جلب الرسائل من قاعدة البيانات...</div>
            </div>

            <button class="btn logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>
    </div>

    <!-- استدعاء مكتبة Firebase عبر CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://gggg-24b22-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.registerUser = async function(event) {
            event.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            const email = username + "@ured.com";

            const btn = document.getElementById('submitBtn');
            btn.innerText = "جاري إنشاء الحساب...";
            btn.disabled = true;

            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `users/${username}`));
                
                if (snapshot.exists()) {
                    alert("اسم المستخدم مستخدم مفعل مسبقاً، اختر اسمًا آخر!");
                    btn.innerText = "إنشاء الحساب ودخول البريد";
                    btn.disabled = false;
                    return;
                }

                await set(ref(db, 'users/' + username), {
                    fullName: fullName,
                    email: email,
                    password: password,
                    createdAt: new Date().toISOString()
                });

                localStorage.setItem('ironFireUser', username);
                localStorage.setItem('ironFireEmail', email);

                loadInbox(username, email);

            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء الاتصال بقاعدة البيانات: " + error.message);
                btn.innerText = "إنشاء الحساب ودخول البريد";
                btn.disabled = false;
            }
        };

        window.loadInbox = async function(username, email) {
            document.getElementById('signupSection').classList.add('hidden');
            document.getElementById('inboxSection').classList.remove('hidden');
            document.getElementById('currentEmailBadge').innerText = email;

            const messageList = document.getElementById('messageList');
            messageList.innerHTML = `<div class="no-messages">جاري مزامنة الرسائل...</div>`;

            try {
                const inboxRef = ref(db, 'inboxes/' + username);
                const snapshot = await get(inboxRef);

                messageList.innerHTML = "";
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const msg = childSnapshot.val();
                        messageList.innerHTML += `
                            <div class="message-card">
                                <h4>📌 ${msg.title}</h4>
                                <p>${msg.body}</p>
                                <small style="color: #64748b; font-size: 11px; display: block; margin-top: 5px;">${msg.date}</small>
                            </div>
                        `;
                    });
                } else {
                    messageList.innerHTML = `<div class="no-messages">لا توجد رسائل واردة حالياً. البريد فارغ.</div>`;
                }
            } catch (err) {
                console.error(err);
                messageList.innerHTML = `<div class="no-messages">فشل في تحميل الرسائل.</div>`;
            }
        };

        window.logout = function() {
            localStorage.removeItem('ironFireUser');
            localStorage.removeItem('ironFireEmail');
            location.reload();
        };

        window.onload = function() {
            const savedUser = localStorage.getItem('ironFireUser');
            const savedEmail = localStorage.getItem('ironFireEmail');
            if (savedUser && savedEmail) {
                loadInbox(savedUser, savedEmail);
            }
        };
    </script>
</body>
</html>
